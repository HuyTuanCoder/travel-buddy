spring.application.name=location-service

# JPA — let Hibernate auto-create/update tables in the 'location' schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=location

# Google Maps API Key — injected from docker-compose environment
google.maps.api-key=${GOOGLE_MAPS_API_KEY}

# Distributed Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{correlationId}] - %msg%n
