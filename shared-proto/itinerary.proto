syntax = "proto3";

package com.travelbuddy.itinerary;

option java_multiple_files = true;
option java_package = "com.travelbuddy.itinerary.grpc";
option java_outer_classname = "ItineraryProto";

// The gRPC Service Definition exposed to the Python AI Worker
service ItineraryGrpcService {
  // Add a stop to a specific day
  rpc AddStop (AddStopGrpcRequest) returns (TripStopGrpcResponse);
}

enum StopTypeGrpc {
  UNKNOWN = 0;
  ATTRACTION = 1;
  RESTAURANT = 2;
  HOTEL = 3;
  TRANSIT = 4;
}

message AddStopGrpcRequest {
  string day_id = 1;
  string user_id = 2;
  string google_place_id = 3;
  StopTypeGrpc stop_type = 4;
  
  // Using ISO-8601 strings for Time/Decimal to keep protobuf simple
  string arrival_time = 5;
  string departure_time = 6;
  string estimated_cost = 7;
  string user_notes = 8;
}

message TripStopGrpcResponse {
  string id = 1;
  string google_place_id = 2;
  int32 visit_order = 3;
  string arrival_time = 4;
  string departure_time = 5;
  StopTypeGrpc stop_type = 6;
  string estimated_cost = 7;
  string user_notes = 8;
  
  // Hydrated location fields
  string location_name = 9;
  string address = 10;
  double latitude = 11;
  double longitude = 12;
  string image_url = 13;
}
