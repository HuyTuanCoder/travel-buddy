[tool.poetry]
name = "ai-agent-fastapi"
version = "0.1.0"
description = "Travel Buddy AI Orchestration Worker"
authors = ["Travel Buddy Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
langgraph = "^0.0.65"
langchain-core = "^0.2.9"
langchain-google-genai = "^1.0.6"
pydantic = "^2.7.4"
sqlalchemy = "^2.0.30"
asyncpg = "^0.30.0"
redis = "^5.0.6"
celery = "^5.4.0"
langfuse = "^2.35.0"
python-dotenv = "^1.0.1"
sse-starlette = "^2.1.2"
langgraph-checkpoint-postgres = "^3.1.0"
psycopg = "^3.3.4"
psycopg-pool = "^3.3.1"
grpcio = "~1.62.0"
grpcio-tools = "~1.62.0"
pika = "^1.4.1"
spacy = "^3.7.4"
sentence-transformers = "^3.0.1"
qdrant-client = "^1.9.1"
duckduckgo-search = "^6.1.7"
googlemaps = "^4.10.0"
requests = "^2.31.0"
structlog = "^26.1.0"
langchain-google-vertexai = "<2.0.0"
pydantic-settings = "^2.14.2"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
