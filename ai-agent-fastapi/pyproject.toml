[tool.poetry]
name = "ai-agent-fastapi"
version = "0.1.0"
description = "Travel Buddy AI Orchestration Worker"
authors = ["Travel Buddy Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
torch = {version = "^2.2.0", source = "pytorch-cpu"}
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
langgraph = "^1.2.6"
langchain = "^1.3.11"
langchain-core = "^1.4.8"
langchain-google-genai = "^2.0.1"
pydantic = "^2.7.4"
sqlalchemy = "^2.0.30"
asyncpg = "^0.30.0"
redis = "^5.0.6"
celery = "^5.4.0"
langfuse = "^2.50.0"
python-dotenv = "^1.0.1"
sse-starlette = "^2.1.2"
langgraph-checkpoint-postgres = "^3.1.0"
psycopg = "^3.3.4"
psycopg-pool = "^3.3.1"
grpcio = "^1.81.0"
grpcio-tools = "^1.81.0"
pika = "^1.4.1"
sentence-transformers = "^3.0.1"
qdrant-client = "^1.9.1"
googlemaps = "^4.10.0"
requests = "^2.31.0"
structlog = "^26.1.0"
langchain-google-vertexai = "^3.2.4"
pydantic-settings = "^2.14.2"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"