[tool.poetry]
name = "ai-agent-fastapi"
version = "0.1.0"
description = "Travel Buddy AI Orchestration Worker"
authors = ["Travel Buddy Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
langgraph = "^0.0.65"
langchain-core = "^0.2.9"
langchain-google-genai = "^1.0.6"
pydantic = "^2.7.4"
sqlalchemy = "^2.0.30"
asyncpg = "^0.30.0"
redis = "^5.0.6"
celery = "^5.4.0"
langfuse = "^2.35.0"
python-dotenv = "^1.0.1"
sse-starlette = "^2.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
